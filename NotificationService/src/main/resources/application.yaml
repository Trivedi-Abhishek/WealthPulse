server:
  port: 8085

spring:
  application:
    name: NotificationService

  datasource:
    url: jdbc:postgresql://localhost:5432/wealth_plus_db
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification

  # Every service shares wealth_plus_db, so each owns a private schema and its own
  # Flyway history table — otherwise all five claim version 1 in public.flyway_schema_history
  # and only the first to boot survives the checksum check.
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # One group per service. Kafka assigns each partition to only ONE member of a group, so
      # sharing a group across services splits every topic between them instead of fanning it
      # out: each service would see only the partitions it happened to be assigned.
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
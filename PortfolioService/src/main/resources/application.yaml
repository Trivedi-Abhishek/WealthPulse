server:
  port: 8081

spring:
  application:
    name: PortfolioService

  datasource:
    url: jdbc:postgresql://localhost:5432/wealth_plus_db
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: portfolio

  # Every service shares wealth_plus_db, so each owns a private schema and its own
  # Flyway history table — otherwise all five claim version 1 in public.flyway_schema_history
  # and only the first to boot survives the checksum check.
  flyway:
    enabled: true
    schemas: portfolio
    default-schema: portfolio

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring:
  application:
    name: RoboAdvisorService

  datasource:
    url: jdbc:postgresql://localhost:5432/wealth_plus_db
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: wealth-plus-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

resilience4j:
  circuitbreaker:
    instances:
      openai-chat:
        failureRateThreshold: 50
        slidingWindowSize: 10
  retry:
    instances:
      openai-chat:
        maxAttempts: 3
        waitDuration: 2s
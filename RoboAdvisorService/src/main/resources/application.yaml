server:
  port: 8086

spring:
  application:
    name: RoboAdvisorService

  datasource:
    url: jdbc:postgresql://localhost:5432/wealth_plus_db
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: robo

  # Every service shares wealth_plus_db, so each owns a private schema and its own
  # Flyway history table — otherwise all five claim version 1 in public.flyway_schema_history
  # and only the first to boot survives the checksum check.
  flyway:
    enabled: true
    schemas: robo
    default-schema: robo

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: wealth-plus-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

resilience4j:
  circuitbreaker:
    instances:
      openai-chat:
        failureRateThreshold: 50
        slidingWindowSize: 10
  retry:
    instances:
      openai-chat:
        maxAttempts: 3
        waitDuration: 2s